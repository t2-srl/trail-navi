<style>
/* Layout: a trail logbook — race tabs, a spec strip like a course profile, then a filterable list of links. Accent = the pink marking tape tied to trees on Japanese trails. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#1d2a24; --muted:#5d6b63; --line:#d9e0da;
  --moss:#2f5d47; --tape:#d0336f; --tape-soft:#fbe4ee; --video:#7a4bb5; --video-soft:#efe7f9;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --ink:#e4ebe6; --muted:#9aa8a0; --line:#2e3933;
  --moss:#8cc4a6; --tape:#f0679b; --tape-soft:#3a2230; --video:#b996e8; --video-soft:#2c2338; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --ink:#e4ebe6; --muted:#9aa8a0; --line:#2e3933;
  --moss:#8cc4a6; --tape:#f0679b; --tape-soft:#3a2230; --video:#b996e8; --video-soft:#2c2338; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:920px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px;border-radius:4px}

header{padding-block:32px 20px;display:grid;gap:6px}
.toprow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lsw{font:inherit;font-size:12.5px;border:0;background:var(--surface);color:var(--muted);padding:4px 12px;cursor:pointer}
.lsw[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lg{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;background:var(--line);color:var(--ink)}
.lg.en,.lg.both{background:var(--moss);color:var(--bg)}
.tip{font-size:13px;color:var(--muted);margin:0 0 8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.25;margin:0;text-wrap:balance}
h1 .tape{display:inline-block;background:var(--tape);color:#fff;padding:0 .3em;transform:rotate(-1.5deg);margin-left:.15em}
.lead{color:var(--muted);margin:0;max-width:62ch}

.notice{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:24px}
.notice b{color:var(--ink)}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tab{font-family:var(--f-display);font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
.tab small{font-family:var(--f-body);font-weight:500;color:var(--muted);margin-left:6px;font-size:12px}
.tab[aria-selected="true"]{border-color:var(--moss);background:var(--moss);color:var(--bg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.8}

.race{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;margin-bottom:20px}
.race h2{font-family:var(--f-display);font-weight:900;font-size:24px;margin:0;line-height:1.3}
.race .sub{color:var(--muted);font-size:13px;margin:0}
.race p{margin:0;max-width:65ch}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.spec{border-top:3px solid var(--moss);padding-top:8px;min-width:0}
.spec .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.spec .v{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.callout{background:var(--tape-soft);border-radius:8px;padding:10px 14px;font-size:13.5px}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px}
.links a{color:var(--moss);font-weight:700}

.filters{display:grid;gap:10px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lbl{font-size:12px;color:var(--muted);width:4.5em}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:3px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#q{font:inherit;font-size:14px;width:100%;max-width:360px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:4px 0 8px}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:3.6em 1fr;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.kind{font-size:11.5px;font-weight:700;text-align:center;border-radius:4px;padding:2px 0;align-self:start;margin-top:3px}
.kind.blog{background:var(--tape-soft);color:var(--tape)}
.kind.video{background:var(--video-soft);color:var(--video)}
.body{min-width:0}
.body a{font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.body a:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:2px}
.meta .yr{font-family:var(--f-mono)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 6px}
.empty{padding:24px 4px;color:var(--muted)}
.yearhead{font-family:var(--f-mono);font-size:13px;color:var(--moss);padding:16px 4px 4px;border-bottom:2px solid var(--moss)}

footer{margin-top:32px;font-size:12.5px;color:var(--muted);display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="toprow">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="langsw" role="group" aria-label="Language">
        <button class="lsw" id="lang-ja" data-lang="ja">日本語</button>
        <button class="lsw" id="lang-en" data-lang="en">English</button>
      </div>
    </div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
  </header>

  <div class="notice" id="notice"></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section class="race" id="race"></section>

  <div class="filters">
    <input id="q" type="search">
    <div class="row" id="yearRow"><span class="lbl"></span></div>
    <div class="row" id="distRow"><span class="lbl"></span></div>
    <div class="row" id="kindRow"><span class="lbl"></span></div>
    <div class="row" id="langRow"><span class="lbl"></span></div>
    <div class="row" id="tagRow"><span class="lbl"></span></div>
  </div>
  <p class="tip" id="tip"></p>
  <div class="count" id="count" aria-live="polite"></div>
  <ul class="list" id="list"></ul>

  <footer id="footer"></footer>
</div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = () => STR[UI];

const distL = d => d==="unknown" ? S().distUnknown : (UI==="en" ? (DIST_EN[d]||d) : d);

function renderChrome(){
  document.documentElement.lang = UI;
  document.title = UI==="en" ? "Trail Race Logbook" : "トレラン体験記ナビ";
  $("eyebrow").textContent = S().eyebrow; $("h1").innerHTML = S().h1; $("lead").textContent = S().lead;
  $("notice").innerHTML = S().notice; $("footer").innerHTML = S().footer;
  $("q").placeholder = S().q; $("q").setAttribute("aria-label", S().q);
  [["yearRow","year"],["distRow","dist"],["kindRow","kind"],["langRow","lang"],["tagRow","tag"]].forEach(([r,k]) => $(r).querySelector(".lbl").textContent = S()[k]);
  $("tip").textContent = S().tip; $("tip").hidden = !S().tip;
  document.querySelectorAll(".lsw").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===UI));
}
function renderTabs(){
  $("tabs").innerHTML = Object.keys(RACES).map(id => { const r = R(id);
    return `<button class="tab" role="tab" id="tab-${id}" aria-selected="${id===state.race}" data-race="${id}">${esc(r.tab)}<small>${esc(r.tabSub)}</small></button>`; }).join("");
}
function renderRace(){
  const r = R(state.race);
  $("race").innerHTML = `
    <div><h2>${esc(r.name)}</h2><p class="sub">${esc(r.sub)}</p></div>
    <p>${esc(r.desc)}</p>
    <div class="specs">${r.specs.map(([k,v])=>`<div class="spec"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>
    <div class="callout">${esc(r.callout)}</div>
    <div class="links">${r.links.map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("")}</div>`;
}
function chipRow(rowId, prefix, options, current, onPick){
  const row = $(rowId); row.querySelectorAll(".chip").forEach(n=>n.remove());
  [["", S().all], ...options].forEach(([v,l],idx) => { const b=document.createElement("button"); b.className="chip"; b.id=prefix+idx; b.textContent=l;
    b.setAttribute("aria-pressed", (current||"")===v); b.onclick=()=>{onPick(v||null); renderFilters(); renderList();}; row.appendChild(b); });
}
function renderFilters(){
  const inRace = ITEMS.filter(i=>i.r===state.race);
  const years = [...new Set(inRace.map(yearKey))].sort((a,b)=> a==="unknown"?1 : b==="unknown"?-1 : b-a);
  chipRow("yearRow","year-", years.map(y=>[y, y==="unknown"?S().yearUnknown:y]), state.year, v=>state.year=v);
  const dists = [...new Set(inRace.map(distKey))].sort((a,b)=> a==="unknown"?1 : b==="unknown"?-1 : a.localeCompare(b));
  $("distRow").hidden = dists.length < 2;
  chipRow("distRow","dist-", dists.map(d=>[d, distL(d)]), state.dist, v=>state.dist=v);
  chipRow("kindRow","kind-", [["blog",S().blog],["video",S().video]], state.kind==="all"?null:state.kind, v=>state.kind=v||"all");
  chipRow("langRow","lang-", [["ja",LG_LABEL[UI].ja],["en",UI==="en"?"English / bilingual":"英語・日英"]], state.lang, v=>state.lang=v);
  const tr = $("tagRow"); tr.querySelectorAll(".chip").forEach(n=>n.remove());
  const present = new Set(inRace.flatMap(i=>i.tags));
  TAGS.filter(t=>present.has(t)).forEach(t => { const b=document.createElement("button"); b.className="chip"; b.id="tag-"+TAGS.indexOf(t); b.textContent=tagL(t); b.setAttribute("aria-pressed", state.tag===t); b.onclick=()=>{state.tag = state.tag===t?null:t; renderFilters(); renderList();}; tr.appendChild(b); });
}
function renderList(){
  const q = state.q.trim().toLowerCase();
  const rows = ITEMS.filter(i => i.r===state.race
    && (state.kind==="all" || i.k===state.kind)
    && (!state.tag || i.tags.includes(state.tag))
    && (!state.year || yearKey(i)===state.year)
    && (!state.dist || distKey(i)===state.dist)
    && (!state.lang || (state.lang==="ja" ? i.lg!=="en" : i.lg!=="ja"))
    && (!q || [i.t,i.tEn||"",i.s,i.d,String(i.y||""),...i.tags,...i.tags.map(t=>TAG_EN[t])].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(b.y||0)-(a.y||0));
  $("count").textContent = S().count(rows.length);
  let lastYear;
  $("list").innerHTML = rows.length ? rows.map(i => {
    const yk = yearKey(i), head = yk!==lastYear ? `<li class="yearhead">${yk==="unknown"?S().yearUnknown:S().yr(yk)}</li>` : "";
    lastYear = yk;
    const url = UI==="en" && i.uEn ? i.uEn : i.u;
    const title = UI==="en" && i.tEn ? i.tEn : i.t;
    const src = UI==="en" ? (SRC_EN[i.s]||i.s) : i.s;
    return head + `
    <li class="item">
      <span class="kind ${i.k}">${i.k==="video"?S().video:S().blog}</span>
      <div class="body">
        <a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a>
        <div class="meta">
          <span class="lg ${i.lg}">${LG_LABEL[UI][i.lg]}</span>
          <span class="yr">${i.y ? S().yr(i.y) : S().yearUnknown}</span>
          ${i.d?`<span>${esc(distL(i.d))}</span>`:""}
          ${i.tags.map(t=>`<span class="tag">${esc(tagL(t))}</span>`).join("")}
          <span>${esc(src)}</span>
        </div>
      </div>
    </li>`; }).join("") : `<li class="empty">${S().empty}</li>`;
}
function renderAll(){ renderChrome(); renderTabs(); renderRace(); renderFilters(); renderList(); }
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-race]"); if(!b) return;
  state.race = b.dataset.race; state.tag = null; state.year = null; state.dist = null;
  try{ localStorage.setItem("tn-race", state.race); }catch(err){}
  renderAll();
});
document.querySelectorAll(".lsw").forEach(b => b.addEventListener("click", () => {
  UI = b.dataset.lang; try{ localStorage.setItem("tn-ui", UI); }catch(err){}
  renderAll();
}));
$("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
renderAll();
</script>
